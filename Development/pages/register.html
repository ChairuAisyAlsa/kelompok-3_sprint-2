<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daftar Akun – ClosetGirls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-page="register">
  <main class="app">
    <div class="auth auth--register">
      <div class="auth-logo"><img src="../assets/images/logo.svg" alt="ClosetGirls Thrift Store"></div>
      <h1 class="auth-title">Daftar Akun</h1>
      <p class="auth-sub">Yuk, mulai pengalaman thrift kamu bersama kami.</p>
      <form class="auth-form" id="register-form" novalidate>
        <div class="input-wrap"><i data-icon="user" data-size="18"></i><input type="text" id="name" placeholder="Nama lengkap" autocomplete="name"></div>
        <div class="input-wrap"><i data-icon="mail" data-size="18"></i><input type="email" id="email" placeholder="Email" autocomplete="email"></div>
        <div class="input-wrap"><i data-icon="phone" data-size="18"></i><input type="tel" id="phone" placeholder="Nomor telepon" autocomplete="tel"></div>
        <div class="input-wrap"><i data-icon="lock" data-size="18"></i><input type="password" id="password" placeholder="Kata sandi" autocomplete="new-password"><button type="button" data-toggle-pass aria-label="Tampilkan kata sandi"><i data-icon="eye" data-size="18"></i></button></div>
        <div class="input-wrap"><i data-icon="lock" data-size="18"></i><input type="password" id="confirm" placeholder="Konfirmasi kata sandi" autocomplete="new-password"><button type="button" data-toggle-pass aria-label="Tampilkan kata sandi"><i data-icon="eye" data-size="18"></i></button></div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="btn" type="submit">Daftar</button>
      </form>
      <p class="auth-switch">Sudah punya akun? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="../js/data/products.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
