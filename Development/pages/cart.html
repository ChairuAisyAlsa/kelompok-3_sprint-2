<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keranjang – ClosetGirls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-page="cart">
  <main class="app app--sticky">
    <header class="page-header">
      <button class="icon-btn" data-back="home.html" aria-label="Kembali"><i data-icon="back"></i></button>
      <h1>KERANJANG</h1>
      <button class="icon-btn" id="btn-clear" aria-label="Kosongkan keranjang"><i data-icon="trash"></i></button>
    </header>
    <div class="cart-list" id="cart-list"></div>
    <div class="sticky-bottom" id="cart-footer" hidden>
      <div class="summary-bar"><span id="cart-total-label">Total (0 Produk)</span><strong id="cart-total">Rp0</strong></div>
      <div class="sticky-bottom__actions"><a class="btn btn-primary" href="checkout.html">Checkout</a></div>
    </div>
  </main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama"></nav>
  <script src="../js/data/products.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/app.js"></script>

</html>
