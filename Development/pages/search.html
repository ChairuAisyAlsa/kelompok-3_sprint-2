<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pencarian – ClosetGirls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-page="search">
  <main class="app">
    <header class="page-header">
      <button class="icon-btn" data-back="home.html" aria-label="Kembali"><i data-icon="back"></i></button>
      <label class="search-bar" style="flex:1"><i data-icon="search" data-size="18"></i><input type="search" id="search-input" placeholder="Cari produk" aria-label="Cari produk"><button type="button" id="btn-clear" aria-label="Hapus pencarian" hidden><i data-icon="close" data-size="16"></i></button></label>
    </header>
    <div class="chips" id="chips"></div>
    <div class="section" style="display:flex;align-items:center;justify-content:space-between">
      <div><h2 class="section-title" style="margin:0">Hasil Pencarian</h2><p class="muted" id="result-info"></p></div>
      <button class="icon-btn" id="btn-filter" aria-label="Urutkan"><i data-icon="filter"></i></button>
    </div>
    <div class="product-grid" id="grid"></div>
  </main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama"></nav>
  <script src="../js/data/products.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
